<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px sans-serif; width: 260px; padding: 10px; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px; }
    button { margin-top: 10px; width: 100%; padding: 6px; }
    #status { margin-top: 8px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h3 style="margin:0">Jarvis Browser Bridge</h3>
  <label>Bridge port</label>
  <input id="port" type="number" placeholder="8080">
  <label>Shared token (from JARVIS_BRIDGE_TOKEN)</label>
  <input id="token" type="password" placeholder="paste the token here">
  <button id="save">Save & Reconnect</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
